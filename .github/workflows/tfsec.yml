name: tfsec Security Scan

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
  pull_request:
    paths:
      - "terraform/**"

jobs:
  security:
    uses: rdavis542/aws-github-workflows/.github/workflows/tfsec.yml@main
    permissions:
      actions: read
      contents: read
      security-events: write
      pull-requests: write
